<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grind the Terms — Embedded</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#100b17}
grind-the-terms{display:block;width:100%;height:100%;aspect-ratio:auto}
.fallback{color:#fff;font:14px monospace;padding:2rem;text-align:center}</style>
</head>
<body>
<grind-the-terms layout="portrait" skin="../skins/au/skin.json"><p class="fallback">Loading Grind the Terms…</p></grind-the-terms>
<script type="module" src="../dist/grind-the-terms.js"></script>
<script>
if(new URLSearchParams(location.search).get('practice')==='drones'){
  const game=document.querySelector('grind-the-terms');
  game.setAttribute('practice','drones');
  game.setAttribute('storage-key','au-arcade-drone-practice');
}
for(const type of ['game:ready','game:skin-loaded','game:start','game:pause','game:resume','game:over','game:share','game:error'])
  document.addEventListener(type,e=>parent.postMessage({source:'punk-arcade',type,detail:e.detail},location.origin));
</script>
</body>
</html>
