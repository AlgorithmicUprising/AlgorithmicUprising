<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grind the Terms — Fony Sprock</title><style>html,body{margin:0;min-height:100%;background:#100b17;color:#eee9e1;font:16px monospace}main{margin:1rem auto;max-width:1080px;padding:1rem}h1{color:#d7ff00}grind-the-terms{height:auto;width:100%;border:2px solid #d7ff00}button{cursor:pointer;padding:.6rem;background:#e0287a;border:0;font-weight:bold}.note{line-height:1.6}a{color:#d7ff00}</style></head><body><main><h1>GRIND THE TERMS — FONY PROTOTYPE</h1><p>Nobody reads them. Skate them.</p><p class="note">Space / tap to ollie. HOLD through the descent to catch a rail; RELEASE to pop off. Find AIR BOOST to unlock one double jump.</p><button id="au">AU Art</button> <button id="placeholder">Placeholder</button><grind-the-terms skin="../../skins/au/skin.json"></grind-the-terms><pre id="events" aria-live="polite"></pre><p><a href="../../../demo/">Back to Arcade Lab</a></p></main><script type="module" src="../../dist/grind-the-terms.js"></script><script>for(const e of ['game:ready','game:skin-loaded','game:error','game:start','game:over','game:grind-start','game:grind-end','game:power'])document.addEventListener(e,x=>{const t=document.querySelector('#events');t.textContent=(x.type+' '+JSON.stringify(x.detail)+'\n'+t.textContent).slice(0,2000)});document.querySelector('#au').onclick=()=>document.querySelector('grind-the-terms').setAttribute('skin','../../skins/au/skin.json');document.querySelector('#placeholder').onclick=()=>document.querySelector('grind-the-terms').removeAttribute('skin')</script></body></html>
