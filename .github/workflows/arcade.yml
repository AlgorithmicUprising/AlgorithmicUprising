name: Punk Arcade CI
on:
  push:
    paths: ['arcade/**', '.github/workflows/arcade.yml']
  pull_request:
    paths: ['arcade/**', '.github/workflows/arcade.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: punk-arcade-demo
          path: arcade/
          if-no-files-found: error
          retention-days: 7
