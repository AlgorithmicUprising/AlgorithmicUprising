name: Punk Arcade CI
on:
  push:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  pull_request:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  workflow_dispatch:
permissions:
  contents: read
# One group per ref, so a pull request does not wait behind a main publish.
# On main, do not cancel the run already in progress. deploy-pages can still
# finish after Actions marks the job cancelled, and that older publication
# would replace a newer one. Feature branches still cancel stale CI.
concurrency:
  group: punk-arcade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-browser-test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check combined Pages publish rules
        working-directory: ${{ github.workspace }}
        run: node open-world/tools/check-pages-workflow.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verify matching Playwright browsers
        run: npx playwright install --list
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punk-arcade-browser-results
          path: |
            arcade/test-results/screenshots/
            arcade/playwright-report/
            arcade/test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: punk-arcade-demo
          path: |
            arcade/demo/
            arcade/games/*/dist/
            arcade/games/*/skins/
            arcade/games/*/demo/
            arcade/games/bars-per-watt/catalog.json
          if-no-files-found: error
          retention-days: 14
  deploy-main:
    name: Publish arcade and HQ Pages from main
    needs: build-and-browser-test
    # One Pages site. Feature branches only run CI. Every main deploy rebuilds both
    # trees so an arcade-only push cannot drop /open-world/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: arcade
      - run: npm run build
        working-directory: arcade
      - run: npm run stage-pages
        working-directory: arcade
      - name: Install pinned Godot 4.7.2
        id: godot
        run: echo "bin=$(bash open-world/tools/install-godot.sh)" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg for the Act I intro placeholder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Export the single-threaded HQ web build
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p open-world/node_modules open-world/build
          : > open-world/node_modules/.gdignore
          : > open-world/build/.gdignore
          rm -rf open-world/.godot
          # A game run does not import. The suite checks imported atlases and the dark quarter face, so import first.
          "$GODOT_BIN" --headless --path open-world --import
          "$GODOT_BIN" --headless --path open-world res://tests/test_main.tscn
          node open-world/tools/export-web.mjs
      - name: Add /open-world/ without changing arcade files
        run: node open-world/tools/stage-composite.mjs --into-staged
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arcade/.pages
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy-paradise-preview:
    name: Publish unlisted Paradise Offline preview
    needs: build-and-browser-test
    if: github.ref == 'refs/heads/feat/paradise-offline-par3-preview' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current main for the existing public Pages tree
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach "$GITHUB_WORKSPACE/main-site" FETCH_HEAD
      - name: Build and stage the current main Arcade
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run stage-pages
        working-directory: main-site/arcade
      - name: Install pinned Godot 4.7.2
        id: godot
        run: echo "bin=$(bash open-world/tools/install-godot.sh)" >> "$GITHUB_OUTPUT"
        working-directory: main-site
      - name: Install ffmpeg for the Act I intro placeholder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Export the current main HQ web build
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p open-world/node_modules open-world/build
          : > open-world/node_modules/.gdignore
          : > open-world/build/.gdignore
          rm -rf open-world/.godot
          "$GODOT_BIN" --headless --path open-world --import
          "$GODOT_BIN" --headless --path open-world res://tests/test_main.tscn
          node open-world/tools/export-web.mjs
        working-directory: main-site
      - name: Add the current main HQ build
        run: node open-world/tools/stage-composite.mjs --into-staged
        working-directory: main-site
      - name: Build the Paradise preview bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: arcade
      - name: Add Paradise at its direct preview path
        run: |
          set -euo pipefail
          destination="main-site/arcade/.pages/previews/paradise-offline"
          mkdir -p "$destination"
          cp -R arcade/games/paradise-offline-par1/dist "$destination/dist"
          cp -R arcade/games/paradise-offline-par1/demo "$destination/demo"
          mkdir -p "$destination/skins/au/assets"
          cp arcade/games/paradise-offline-par1/skins/au/skin.json "$destination/skins/au/skin.json"
          cp -R arcade/games/paradise-offline-par1/skins/au/assets/. "$destination/skins/au/assets/"
          test -s "$destination/demo/index.html"
          test -s "$destination/dist/paradise-offline-par1.js"
          test -s "$destination/skins/au/skin.json"
          test -s "$destination/skins/au/assets/yard-landscape.webp"
          test -s "$destination/skins/au/assets/yard-portrait.webp"
          test -s "$destination/skins/au/assets/hosts.webp"
          test -s "$destination/skins/au/assets/props.webp"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/arcade/.pages
      - id: deployment
        uses: actions/deploy-pages@v4
