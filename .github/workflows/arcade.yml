name: Punk Arcade CI
on:
  push:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  pull_request:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  workflow_dispatch:
permissions:
  contents: read
# One group per ref, so a pull request does not wait behind a main publish.
# On main, do not cancel the run already in progress. deploy-pages can still
# finish after Actions marks the job cancelled, and that older publication
# would replace a newer one. Feature branches still cancel stale CI.
concurrency:
  group: punk-arcade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-browser-test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check combined Pages publish rules
        working-directory: ${{ github.workspace }}
        run: node open-world/tools/check-pages-workflow.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node tools/deploy-r2-assets.mjs --validate
      - run: npm test
      - name: Verify matching Playwright browsers
        run: npx playwright install --list
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punk-arcade-browser-results
          path: |
            arcade/test-results/screenshots/
            arcade/playwright-report/
            arcade/test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: punk-arcade-demo
          path: |
            arcade/demo/
            arcade/games/*/dist/
            arcade/games/*/skins/
            arcade/games/*/demo/
            arcade/games/bars-per-watt/catalog.json
          if-no-files-found: error
          retention-days: 14
  deploy-main:
    name: Publish arcade and HQ Pages from main
    needs: build-and-browser-test
    # One Pages site. Feature branches only run CI. Every main deploy rebuilds both
    # trees so an arcade-only push cannot drop /open-world/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Bars Per Watt R2 changes
        id: r2-changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          set +e
          git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- arcade/r2-assets arcade/games/bars-per-watt/catalog.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Require a merged pull request for R2 publishing
        id: r2-merged
        if: steps.r2-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100
              }
            );
            const mergedToMain = result.data.some((pr) => pr.merged_at && pr.base?.ref === 'main');
            core.setOutput('is-merged', String(mergedToMain));
            if (!mergedToMain) {
              core.setFailed('R2 assets and catalog changes must reach main through a merged pull request.');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: arcade
      - run: npm run build
        working-directory: arcade
      - run: npm run stage-pages
        working-directory: arcade
      - name: Install pinned Godot 4.7.2
        id: godot
        run: echo "bin=$(bash open-world/tools/install-godot.sh)" >> "$GITHUB_OUTPUT"
      - name: Export the single-threaded HQ web build
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p open-world/node_modules open-world/build
          : > open-world/node_modules/.gdignore
          : > open-world/build/.gdignore
          rm -rf open-world/.godot
          # A game run does not import. The suite checks imported atlases and the dark quarter face, so import first.
          "$GODOT_BIN" --headless --path open-world --import
          "$GODOT_BIN" --headless --path open-world res://tests/test_main.tscn
          node open-world/tools/export-web.mjs
      - name: Add /open-world/ without changing arcade files
        run: node open-world/tools/stage-composite.mjs --into-staged
      - name: Publish Bars Per Watt media to R2
        if: steps.r2-changes.outputs.changed == 'true'
        working-directory: arcade
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_MERGED_PR: ${{ steps.r2-merged.outputs.is-merged }}
        run: node tools/deploy-r2-assets.mjs --upload
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arcade/.pages
      - id: deployment
        uses: actions/deploy-pages@v4
