name: Punk Arcade CI
on:
  push:
    paths: ['arcade/**', '.github/workflows/arcade.yml']
  pull_request:
    paths: ['arcade/**', '.github/workflows/arcade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punk-arcade-browser-results
          path: |
            arcade/test-results/screenshots/
            arcade/test-results/report/
            arcade/test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: punk-arcade-demo
          path: |
            arcade/demo/
            arcade/games/*/dist/
          if-no-files-found: error
          retention-days: 14
