name: Punk Arcade CI
on:
  push:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  pull_request:
    paths:
      - 'arcade/**'
      - 'open-world/**'
      - '.github/workflows/arcade.yml'
  workflow_dispatch:
permissions:
  contents: read
# One group per ref, so a pull request does not wait behind a main publish.
# On main, do not cancel the run already in progress. deploy-pages can still
# finish after Actions marks the job cancelled, and that older publication
# would replace a newer one. Feature branches still cancel stale CI.
concurrency:
  group: punk-arcade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-browser-test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check combined Pages publish rules
        working-directory: ${{ github.workspace }}
        run: node open-world/tools/check-pages-workflow.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verify matching Playwright browsers
        run: npx playwright install --list
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punk-arcade-browser-results
          path: |
            arcade/test-results/screenshots/
            arcade/playwright-report/
            arcade/test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: punk-arcade-demo
          path: |
            arcade/demo/
            arcade/games/*/dist/
            arcade/games/*/skins/
            arcade/games/*/demo/
            arcade/games/bars-per-watt/catalog.json
          if-no-files-found: error
          retention-days: 14
  deploy-main:
    name: Publish arcade and HQ Pages from main
    needs: build-and-browser-test
    # One Pages site. Feature branches only run CI. Every main deploy rebuilds both
    # trees so an arcade-only push cannot drop /open-world/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: arcade
      - run: npm run build
        working-directory: arcade
      - run: npm run stage-pages
        working-directory: arcade
      - name: Install pinned Godot 4.7.2
        id: godot
        run: echo "bin=$(bash open-world/tools/install-godot.sh)" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg for the Act I intro placeholder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Export the single-threaded HQ web build
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p open-world/node_modules open-world/build
          : > open-world/node_modules/.gdignore
          : > open-world/build/.gdignore
          rm -rf open-world/.godot
          # A game run does not import. The suite checks imported atlases and the dark quarter face, so import first.
          "$GODOT_BIN" --headless --path open-world --import
          "$GODOT_BIN" --headless --path open-world res://tests/test_main.tscn
          node open-world/tools/export-web.mjs
      - name: Add /open-world/ without changing arcade files
        run: node open-world/tools/stage-composite.mjs --into-staged
      - uses: actions/configure-pages@v5
      - id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: arcade/.pages
      # deploy-pages lists artifacts through a different API than the upload
      # confirmation. On #35 and #39 that list still had only the two CI
      # artifacts (punk-arcade-browser-results and punk-arcade-demo) a fraction
      # of a second after github-pages was finalized, so the deploy failed.
      # Wait until this run's list actually contains that one artifact, then
      # give the deploy lookup a moment to see it. One deploy-pages use stays
      # the rule: a second use would publish twice, and a second upload would
      # create a second github-pages artifact.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count=$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length')
            echo "attempt ${attempt}: github-pages artifacts listed: ${count} (uploaded id ${{ steps.pages_artifact.outputs.artifact_id }})"
            if [ "${count}" = "1" ]; then
              echo "listed; waiting 20s so deploy-pages sees the same artifact"
              sleep 20
              exit 0
            fi
            sleep 5
          done
          echo "github-pages artifact was not listed after 60s" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
