# Code scanning for the languages CodeQL actually supports in this repo.
# GDScript (open-world/) is not a CodeQL language. It is not scanned here.
# JavaScript and TypeScript cover the arcade and the Node tools.
# The actions language covers these workflow files.
#
# This workflow uploads a SARIF file to GitHub code scanning. It does not
# build the game, upload a Pages artifact, or call actions/deploy-pages.
# A green run does not publish https://algorithmicuprising.github.io/AlgorithmicUprising/

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query pack can flag main even when nobody pushes.
    - cron: '20 7 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          category: /language:${{ matrix.language }}
